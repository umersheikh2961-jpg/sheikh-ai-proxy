<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sofia AI</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: 'Jost', sans-serif;
  background: #0b1f35;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
.chat-header {
  background: #0b1f35;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(201,168,76,0.2);
}
.avatar {
  width: 40px;
  height: 40px;
  background: #c9a84c;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #0b1f35;
  font-weight: 700;
  font-size: 16px;
}
.header-info h3 { color: #fff; font-size: 15px; }
.header-info p { color: #c9a84c; font-size: 12px; }
.online-dot {
  width: 8px; height: 8px;
  background: #22c55e;
  border-radius: 50%;
  margin-left: auto;
}
#msgs {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.msg-bot {
  background: #fff;
  color: #0b1f35;
  padding: 10px 14px;
  border-radius: 12px 12px 12px 0;
  max-width: 85%;
  font-size: 14px;
  line-height: 1.5;
}
.msg-user {
  background: #c9a84c;
  color: #0b1f35;
  padding: 10px 14px;
  border-radius: 12px 12px 0 12px;
  max-width: 85%;
  font-size: 14px;
  align-self: flex-end;
  font-weight: 600;
}
.qr-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}
.qr-btn {
  background: transparent;
  border: 1px solid #c9a84c;
  color: #c9a84c;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
}
.qr-btn:hover { background: #c9a84c; color: #0b1f35; }
.input-area {
  padding: 12px 16px;
  display: flex;
  gap: 8px;
  border-top: 1px solid rgba(201,168,76,0.2);
  background: #0b1f35;
}
#inp {
  flex: 1;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(201,168,76,0.3);
  border-radius: 24px;
  padding: 10px 16px;
  color: #fff;
  font-size: 14px;
  outline: none;
}
#inp::placeholder { color: rgba(255,255,255,0.4); }
#sendBtn {
  background: #c9a84c;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  color: #0b1f35;
}
.typing { color: rgba(255,255,255,0.5); font-size: 13px; padding: 4px 0; }
.powered {
  text-align: center;
  padding: 6px;
  font-size: 11px;
  color: rgba(255,255,255,0.3);
}
</style>
</head>
<body>
<div class="chat-header">
  <div class="avatar">S</div>
  <div class="header-info">
    <h3>Sofia</h3>
    <p>AI Patient Concierge · Available Now</p>
  </div>
  <div class="online-dot"></div>
</div>

<div id="msgs"></div>

<div class="input-area">
  <input id="inp" placeholder="Ask Sofia anything..." onkeydown="if(event.key==='Enter')send()"/>
  <button id="sendBtn" onclick="send()">➤</button>
</div>
<div class="powered">Powered by Sheikh AI Agency · AI-assisted</div>

<script>
const SYSTEM_PROMPT = `You are Sofia, a warm AI Patient Concierge for a dental clinic. You help patients with appointment booking, treatment questions, pricing inquiries, and general dental information. Be friendly, professional, and helpful. Keep responses concise and conversational.`;

let history = [];

const $msgs = () => document.getElementById('msgs');

function addMsg(html, delay=0){
  return new Promise(r=>setTimeout(()=>{
    const d=document.createElement('div');
    d.innerHTML=html;
    $msgs().appendChild(d);
    $msgs().scrollTop=$msgs().scrollHeight;
    r();
  },delay));
}

function botMsg(text, delay=0){
  return addMsg(`<div class="msg-bot">${text}</div>`, delay);
}

function userMsg(text){
  return addMsg(`<div class="msg-user">${text}</div>`);
}

function showQR(options, delay=0){
  return new Promise(r=>setTimeout(()=>{
    const wrap=document.createElement('div');
    wrap.className='qr-wrap';
    options.forEach(opt=>{
      const btn=document.createElement('button');
      btn.className='qr-btn';
      btn.textContent=opt;
      btn.onclick=()=>{ 
        wrap.remove();
        userMsg(opt);
        handleInput(opt);
      };
      wrap.appendChild(btn);
    });
    $msgs().appendChild(wrap);
    $msgs().scrollTop=$msgs().scrollHeight;
    r();
  },delay));
}

function showTyping(){
  const d=document.createElement('div');
  d.className='typing';
  d.id='typing';
  d.textContent='Sofia is typing...';
  $msgs().appendChild(d);
  $msgs().scrollTop=$msgs().scrollHeight;
}

function removeTyping(){
  const t=document.getElementById('typing');
  if(t) t.remove();
}

async function getAI(text){
  history.push({role:'user',content:text});
  const res=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:[{role:'system',content:SYSTEM_PROMPT},...history]})
  });
  const data=await res.json();
  const reply=data.content?.[0]?.text||data.reply||'Let me help you with that!';
  history.push({role:'assistant',content:reply});
  return reply;
}

async function handleInput(text){
  showTyping();
  await new Promise(r=>setTimeout(r,1000));
  removeTyping();
  const reply=await getAI(text);
  await botMsg(reply);
  showQR(['Book a Consultation','Ask Another Question','WhatsApp Us']);
}

async function send(){
  const inp=document.getElementById('inp');
  const text=inp.value.trim();
  if(!text) return;
  inp.value='';
  await userMsg(text);
  await handleInput(text);
}

// Init
async function init(){
  await botMsg('Hi! I help you schedule dental consultations instantly — even after hours.', 800);
  await botMsg('What treatment are you interested in today?', 1600);
  showQR(['Dental Implants','Invisalign','Veneers & Crowns','Teeth Whitening','Emergency Care','Book a Consultation'], 2400);
}

init();
</script>
</body>
</html>
